<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Elie Mpuhwezimana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1d4ed8; --dark: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; height: 100vh; margin: 0; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        
        .main-wrapper { height: 100vh; width: 100%; overflow: hidden; position: relative; }
        .view-section { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .view-section.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* Sidebar */
        .sidebar { width: 260px; transition: width 0.3s ease; position: relative; z-index: 40; }
        .sidebar.collapsed { width: 72px; }
        .nav-item .sub-menu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .nav-item.open .sub-menu { max-height: 500px; }
        .sidebar.collapsed .nav-item .sub-menu { position: absolute; left: 100%; top: 0; width: 220px; background: #1e293b; border-radius: 0 8px 8px 0; display: none; z-index: 100; padding: 8px; }
        .sidebar.collapsed .nav-item.open .sub-menu { display: block; }
        .sidebar.collapsed .label-text, .sidebar.collapsed .toggle-indicator { display: none; }

        /* Admin Panel */
        #adminPanel { width: 0; transition: width 0.3s ease; background: #ffffff; border-left: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; z-index: 30; }
        .admin-panel-open { width: 320px !important; }
        .admin-delete-controls { display: none !important; }
        body.is-admin .admin-delete-controls { display: flex !important; }

        /* Reopen Button */
        #reopenSidebarBtn { position: fixed; top: 80px; right: 0; background: #1d4ed8; color: white; padding: 8px 12px; border-radius: 6px 0 0 6px; transform: translateX(100%); transition: transform 0.3s ease; cursor: pointer; z-index: 20; font-size: 12px; font-weight: bold; }
        body.is-admin:not(.panel-is-open) #reopenSidebarBtn { transform: translateX(0); }

        /* --- UPLOAD PROCESSING UI --- */
        #uploadProgressContainer { display: none; width: 100%; margin-top: 12px; }
        #uploadCube { height: 8px; width: 100%; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        #uploadCubeFill { height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.05s linear; }
        #uploadPercentText { font-size: 11px; font-weight: 800; color: #10b981; text-align: center; margin-top: 4px; }

        /* PDF View */
        .pdf-page-background { height: 100%; width: 100%; display: flex; flex-direction: column; background-color: #334155; overflow-y: auto; padding: 2rem 1rem; padding-bottom: 100px; }
        .pdf-paper-container { width: 100%; max-width: 1050px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); }
        .pdf-viewer { flex: 1; min-height: 800vh; width: 100%; border: none; display: block; }
        .cv-action-footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: transparent; padding: 1rem 2rem; display: flex; justify-content: flex-end; gap: 1rem; }

        /* Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Up Button */
        #upBtn { position: fixed; bottom: 25px; left: 25px; z-index: 999; background: #0f172a; color: white; width: 50px; height: 50px; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1); animation: floatUpAndDown 2s ease-in-out infinite; }
        #upBtn:hover { background: #1d4ed8; transform: scale(1.1); }
        body.viewing-cv #upBtn { display: flex; }
        @keyframes floatUpAndDown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* Viewer Modal */
        #viewerModal { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; flex-direction: column; }
        #viewerModal.active { display: flex; }
        .viewer-controls { position: absolute; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); padding: 1rem; display: flex; justify-content: center; gap: 1rem; z-index: 10; }
        .viewer-btn { color: white; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; }
        .viewer-btn:hover { background: var(--primary); border-color: var(--primary); }
        #viewerImage, #viewerVideo { transition: transform 0.2s ease; max-height: 90vh; max-width: 90vw; object-fit: contain; }
        
        /* Toast */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 0.75rem 1.5rem; border-radius: 9999px; font-size: 0.875rem; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 99999; pointer-events: none; }
        #toast.show { opacity: 1; }
        #toast.error { background: #ef4444; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="toast">Action Successful</div>
    <div id="reopenSidebarBtn" onclick="openAdminPanel()"><i class="fas fa-upload mr-2"></i> Upload</div>

    <!-- File Viewer Modal -->
    <div id="viewerModal">
        <div class="viewer-controls">
            <button onclick="viewerAction('zoomIn')" class="viewer-btn"><i class="fas fa-search-plus mr-1"></i> Zoom In</button>
            <button onclick="viewerAction('zoomOut')" class="viewer-btn"><i class="fas fa-search-minus mr-1"></i> Zoom Out</button>
            <button onclick="viewerAction('rotateL')" class="viewer-btn"><i class="fas fa-undo mr-1"></i> Rotate</button>
            <button onclick="closeViewer()" class="viewer-btn bg-red-600 border-red-600"><i class="fas fa-times mr-1"></i> Close</button>
        </div>
        <div id="viewerContent" class="flex items-center justify-center h-full w-full"></div>
    </div>

    <div class="main-wrapper">
        <!-- VIEW 1: DASHBOARD -->
        <section id="dashboard-view" class="view-section bg-slate-100 flex flex-col">
            <nav class="h-16 bg-white border-b flex justify-between items-center px-6 z-50 flex-shrink-0 no-print">
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center w-9 h-9 bg-blue-600 text-white rounded-lg text-sm font-extrabold shadow-md">EM</div>
                    <h1 class="text-lg font-bold text-slate-800">Elie MP</h1>
                    <div class="border-l border-slate-200 pl-4 ml-2 flex gap-4 text-xs font-semibold text-slate-600">
                        <a href="index.html" class="hover:text-blue-600 transition-colors">Home</a>
                        <a href="blog.html" class="hover:text-blue-600 transition-colors">Blog</a>
                        <a href="contact.html" class="hover:text-blue-600 transition-colors">Contact</a>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleAdminMode()" id="adminBtn" class="px-3 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-200 transition-all border"><i class="fas fa-lock mr-1"></i> Admin</button>
                    <button onclick="showCV()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold shadow hover:bg-blue-700 transition-all flex items-center gap-2"><i class="fas fa-file-download"></i> Download CV</button>
                </div>
            </nav>

            <div class="flex flex-1 overflow-hidden">
                <aside id="sidebar" class="sidebar bg-slate-900 text-white flex flex-col h-full relative flex-shrink-0 no-print">
                    <button onclick="toggleSidebar()" class="absolute -right-3 top-6 bg-blue-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-lg hover:bg-blue-700 z-50"><i id="toggleIcon" class="fas fa-chevron-left"></i></button>
                    <div class="p-2 flex-1 overflow-y-auto custom-scroll space-y-1 pt-12">
                        <div class="nav-item">
                            <button onclick="toggleSubMenu(this)" class="w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition-colors group"><div class="flex items-center gap-3"><i class="fas fa-laptop-code text-blue-400 w-6 text-center"></i><span class="label-text text-xs font-semibold uppercase tracking-wide">Projects</span></div><i class="fas fa-chevron-right text-[10px] text-slate-500 toggle-indicator arrow"></i></button>
                            <div class="sub-menu pl-4 space-y-1 mt-1">
                                <button onclick="loadContent('projects', 'graphic')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-palette text-purple-400 w-4 text-center"></i> Graphic Design</button>
                                <button onclick="loadContent('projects', 'programming')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-code text-blue-400 w-4 text-center"></i> Programming</button>
                                <button onclick="loadContent('projects', 'social')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-users text-green-400 w-4 text-center"></i> Social Projects</button>
                            </div>
                        </div>
                        <div class="nav-item">
                            <button onclick="toggleSubMenu(this)" class="w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition-colors group"><div class="flex items-center gap-3"><i class="fas fa-folder-open text-yellow-400 w-6 text-center"></i><span class="label-text text-xs font-semibold uppercase tracking-wide">Documents</span></div><i class="fas fa-chevron-right text-[10px] text-slate-500 toggle-indicator arrow"></i></button>
                            <div class="sub-menu pl-4 space-y-1 mt-1">
                                <button onclick="loadContent('documents', 'cv')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-file-alt w-4 text-center"></i> CV</button>
                                <button onclick="loadContent('documents', 'motivation')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-heart w-4 text-center"></i> Motivation</button>
                                <button onclick="loadContent('documents', 'diploma')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-scroll w-4 text-center"></i> Diploma</button>
                            </div>
                        </div>
                        <div class="nav-item">
                            <button onclick="toggleSubMenu(this)" class="w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition-colors group"><div class="flex items-center gap-3"><i class="fas fa-trophy text-amber-400 w-6 text-center"></i><span class="label-text text-xs font-semibold uppercase tracking-wide">Awards</span></div><i class="fas fa-chevron-right text-[10px] text-slate-500 toggle-indicator arrow"></i></button>
                            <div class="sub-menu pl-4 space-y-1 mt-1">
                                <button onclick="loadContent('awards', 'trophies')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-trophy text-yellow-500 w-4 text-center"></i> Trophies</button>
                                <button onclick="loadContent('awards', 'certificates')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-certificate text-blue-400 w-4 text-center"></i> Certificates</button>
                            </div>
                        </div>
                        <div class="nav-item">
                            <button onclick="toggleSubMenu(this)" class="w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition-colors group"><div class="flex items-center gap-3"><i class="fas fa-book text-purple-400 w-6 text-center"></i><span class="label-text text-xs font-semibold uppercase tracking-wide">Publications</span></div><i class="fas fa-chevron-right text-[10px] text-slate-500 toggle-indicator arrow"></i></button>
                            <div class="sub-menu pl-4 space-y-1 mt-1">
                                <button onclick="loadContent('publications', 'books')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-book-open w-4 text-center"></i> Books</button>
                                <button onclick="loadContent('publications', 'stories')" class="sub-btn w-full text-left px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white rounded flex items-center gap-2"><i class="fas fa-feather-alt w-4 text-center"></i> Stories</button>
                            </div>
                        </div>
                    </div>
                </aside>

                <main id="content-panel" class="flex-1 bg-slate-50 p-6 overflow-y-auto custom-scroll relative"></main>

                <!-- RIGHT ADMIN PANEL -->
                <aside id="adminPanel" class="no-print">
                    <div class="w-80 h-full flex flex-col bg-slate-50 border-l border-slate-200">
                        <div class="p-4 border-b bg-white flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm">Upload New Item</h3>
                                <p id="adminPanelContext" class="text-xs text-blue-600 font-medium mt-1">Category: ...</p>
                            </div>
                            <button onclick="closeAdminPanel()" class="text-slate-400 hover:text-red-500 transition-colors text-xl"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="p-4 flex-1 overflow-y-auto custom-scroll space-y-4">
                            <div>
                                <label class="text-xs font-semibold text-slate-600 block mb-1">Title *</label>
                                <input type="text" id="itemTitle" placeholder="Enter title..." class="w-full border p-2 rounded text-sm outline-none bg-white">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-slate-600 block mb-1">Description</label>
                                <textarea id="itemDesc" placeholder="Details..." class="w-full border p-2 rounded text-sm h-24 outline-none bg-white"></textarea>
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-slate-600 block mb-1">File (Any Format)</label>
                                <div class="border-dashed border-2 border-slate-300 rounded-lg p-4 text-center cursor-pointer hover:border-blue-400 transition-colors bg-white" onclick="document.getElementById('itemImage').click()">
                                    <input type="file" id="itemImage" class="hidden">
                                    <i class="fas fa-cloud-upload-alt text-3xl text-slate-300 mb-2"></i>
                                    <p class="text-xs text-slate-500">Click to Upload</p>
                                    <p id="fileName" class="text-[10px] text-blue-500 font-bold mt-1 truncate"></p>
                                </div>
                                <!-- PROGRESS UI -->
                                <div id="uploadProgressContainer">
                                    <div id="uploadCube"><div id="uploadCubeFill"></div></div>
                                    <div id="uploadPercentText">0%</div>
                                </div>
                            </div>
                            <div id="imagePreviewContainer" class="hidden">
                                <p class="text-[10px] text-slate-500 mb-1">Preview:</p>
                                <!-- Preview will be injected here -->
                                <div id="previewWrapper" class="w-full h-32 rounded-lg border overflow-hidden bg-slate-100 flex items-center justify-center"></div>
                            </div>
                        </div>
                        <div class="p-4 border-t bg-white">
                            <button id="saveBtn" onclick="saveItem()" class="w-full bg-blue-600 text-white py-2.5 rounded font-bold text-sm hover:bg-blue-700 transition-colors shadow-lg flex items-center justify-center gap-2"><i class="fas fa-save"></i> Save Item</button>
                        </div>
                    </div>
                </aside>
            </div>
        </section>

        <!-- VIEW 2: CV -->
        <section id="cv-view" class="view-section hidden">
            <div class="pdf-page-background">
                <div class="pdf-paper-container">
                    <embed class="pdf-viewer no-print" src="documents/resume.pdf" type="application/pdf" title="Elie Mpuhwezimana CV">
                </div>
            </div>
            <div class="cv-action-footer no-print">
                <a href="documents/resume.pdf" target="_blank" class="px-6 py-3 bg-slate-800 text-white rounded-lg text-xs font-bold hover:bg-slate-700 transition-all shadow-lg text-center flex items-center gap-2"><i class="fas fa-external-link-alt"></i> Open in New Tab</a>
                <a href="documents/resume.pdf" download="Elie_Mpuhwezimana_CV.pdf" class="px-6 py-3 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition-all shadow-lg text-center flex items-center gap-2"><i class="fas fa-download"></i> Download Now</a>
            </div>
        </section>
        <button id="upBtn" onclick="showDashboard()" title="Go to Dashboard"><i class="fas fa-arrow-up"></i></button>
    </div>

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-xl w-full max-w-sm p-6 space-y-4">
            <h3 class="font-bold text-lg text-slate-800">Admin Access</h3>
            <input type="password" id="adminPass" placeholder="Enter Password" class="w-full border p-2 rounded" value="">
            <div class="flex gap-2">
                <button onclick="verifyAdmin()" class="flex-1 bg-slate-900 text-white p-2 rounded font-bold text-sm">Unlock</button>
                <button onclick="closeAuthModal()" class="flex-1 border p-2 rounded text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // PDF.js CONFIG
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // INDEXED DB SETUP
        const DB_NAME = 'Portfolio_Blob_DB_V3';
        const STORE_NAME = 'files';
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => { const database = e.target.result; if (!database.objectStoreNames.contains(STORE_NAME)) database.createObjectStore(STORE_NAME, { keyPath: 'id' }); };
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onerror = (e) => reject('DB Error');
            });
        }

        function dbAdd(item) { return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readwrite'); const store = tx.objectStore(STORE_NAME); store.add(item); tx.oncomplete = () => resolve(); tx.onerror = (e) => reject(e.target.error); }); }
        function dbDelete(id) { return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readwrite'); const store = tx.objectStore(STORE_NAME); store.delete(id); tx.oncomplete = () => resolve(); tx.onerror = (e) => reject(e.target.error); }); }
        function dbGetAll() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly'); const store = tx.objectStore(STORE_NAME); const request = store.getAll();
                request.onsuccess = () => {
                    const data = { projects: { graphic: [], programming: [], social: [] }, documents: { cv: [], motivation: [], diploma: [], recommendation: [] }, awards: { trophies: [], certificates: [], rewards: [] }, publications: { books: [], stories: [], magazines: [] } };
                    request.result.forEach(item => { if(data[item.category] && data[item.category][item.subcategory]) data[item.category][item.subcategory].push(item); });
                    resolve(data);
                };
            });
        }

        // STATE
        let appData = {};
        let currentCategory = 'projects';
        let currentSubCategory = 'programming';
        let isAdmin = false;
        let pendingDeleteId = null;
        const ADMIN_PASSWORD = "elie";
        let viewerState = { zoom: 1, rotation: 0 };

        window.onload = async () => { await initDB(); appData = await dbGetAll(); loadContent('projects', 'programming'); };

        // VIEW LOGIC
        function showCV() { document.getElementById('dashboard-view').classList.add('hidden'); document.getElementById('cv-view').classList.remove('hidden'); document.body.classList.add('viewing-cv'); }
        function showDashboard() { document.getElementById('cv-view').classList.add('hidden'); document.getElementById('dashboard-view').classList.remove('hidden'); document.body.classList.remove('viewing-cv'); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); document.getElementById('toggleIcon').classList.toggle('fa-chevron-left'); document.getElementById('toggleIcon').classList.toggle('fa-chevron-right'); }
        function toggleSubMenu(btn) { btn.closest('.nav-item').classList.toggle('open'); }
        function openAdminPanel() { document.getElementById('adminPanel').classList.add('admin-panel-open'); document.body.classList.add('panel-is-open'); }
        function closeAdminPanel() { document.getElementById('adminPanel').classList.remove('admin-panel-open'); document.body.classList.remove('panel-is-open'); }
        
        function toggleAdminMode() { if (isAdmin) { isAdmin = false; document.body.classList.remove('is-admin'); document.getElementById('adminBtn').innerHTML = '<i class="fas fa-lock mr-1"></i> Admin'; closeAdminPanel(); renderContent(appData[currentCategory][currentSubCategory], currentSubCategory); } else { document.getElementById('authModal').classList.remove('hidden'); } }
        function verifyAdmin() { if (document.getElementById('adminPass').value === ADMIN_PASSWORD) { isAdmin = true; document.body.classList.add('is-admin'); document.getElementById('adminBtn').innerHTML = '<i class="fas fa-unlock mr-1"></i> Exit Admin'; closeAuthModal(); openAdminPanel(); if (pendingDeleteId !== null) { performDelete(pendingDeleteId); pendingDeleteId = null; } } else { alert("Incorrect Password"); } }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); document.getElementById('adminPass').value = ""; }

        // RENDERING
        function loadContent(cat, sub) { currentCategory = cat; currentSubCategory = sub; if (!appData[cat]) appData[cat] = {}; if (!appData[cat][sub]) appData[cat][sub] = []; renderContent(appData[cat][sub], sub); document.getElementById('adminPanelContext').innerText = "Upload to: " + sub.replace(/([A-Z])/g, ' $1'); }

        function renderContent(items, title) {
            const panel = document.getElementById('content-panel');
            let html = `<div class="flex justify-between items-center mb-6 border-b pb-4"><h2 class="text-xl font-bold text-slate-800 capitalize flex items-center gap-2"><span class="w-2 h-6 bg-blue-600 rounded-full"></span>${title.replace(/([A-Z])/g, ' $1')}</h2></div>`;
            if (!items || items.length === 0) { html += `<div class="flex flex-col items-center justify-center h-64 text-slate-300 border-2 border-dashed rounded-xl"><i class="fas fa-folder-open text-5xl mb-3"></i><p class="font-semibold">No items</p></div>`; }
            else {
                const isVisual = currentCategory !== 'documents';
                // 2. Layout Preservation
                const gridClass = isVisual ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6' : 'space-y-4';
                html += `<div class="${gridClass}">`;
                items.forEach(item => {
                    const thumb = renderThumbnail(item); // 3. Thumbnail Logic
                    const wrapStart = isVisual 
                        ? `<div class="group relative bg-white rounded-xl overflow-hidden shadow hover:shadow-lg transition-all border hover:border-blue-200">` 
                        : `<div class="group relative bg-white rounded-lg shadow-sm border flex justify-between items-center p-4 hover:border-blue-200 transition-colors cursor-pointer">`;
                    
                    html += `
                        ${wrapStart}
                            <div class="h-48 bg-slate-100 overflow-hidden flex items-center justify-center cursor-pointer" onclick="openViewer(${item.id})">${thumb}</div>
                            <div class="${isVisual ? 'p-4' : 'flex-1 flex items-center gap-3'}">
                                ${!isVisual ? `<i class="fas ${item.type === 'pdf' ? 'fa-file-pdf text-red-500' : 'fa-file text-blue-500'} text-2xl w-12 h-12 flex items-center justify-center"></i>` : ''}
                                <div class="${!isVisual ? 'flex-1' : ''}">
                                    <h3 class="font-bold text-sm text-slate-800">${item.title}</h3>
                                    <p class="text-xs text-slate-500 mt-1">${item.desc || ''}</p>
                                </div>
                            </div>
                            <button onclick="event.stopPropagation(); deleteItem(${item.id})" class="admin-delete-controls absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full text-[10px] opacity-0 group-hover:opacity-100 transition-opacity shadow-lg hover:bg-red-600"><i class="fas fa-trash"></i></button>
                        </div>`;
                });
                html += `</div>`;
            }
            panel.innerHTML = html;
        }

        function renderThumbnail(item) {
            // 3. Fixing Black Screen
            if (item.type === 'video' && item.file) {
                const blobUrl = URL.createObjectURL(item.file);
                return `<div class="relative w-full h-full">
                    <video src="${blobUrl}#t=0.5" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"></video>
                    <div class="absolute inset-0 flex items-center justify-center text-white text-4xl opacity-70 pointer-events-none"><i class="fas fa-play-circle"></i></div>
                </div>`;
            }
            if (item.type === 'pdf') { if(item.thumb) return `<img src="${item.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">`; return `<i class="fas fa-file-pdf text-4xl text-red-400"></i>`; }
            if (item.type === 'image' && item.thumb) return `<img src="${item.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">`;
            return `<i class="fas fa-file text-4xl text-slate-300"></i>`;
        }

        // SAVE LOGIC (Processing Sequence)
        async function saveItem() {
            const title = document.getElementById('itemTitle').value;
            if (!title) return showToast("Title required", true);

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = 'Processing...';

            const fileInput = document.getElementById('itemImage');
            const newItem = { id: Date.now(), title, desc: document.getElementById('itemDesc').value, category: currentCategory, subcategory: currentSubCategory, type: 'text', file: null, thumb: null };

            // 4. Processing Sequence
            const progressContainer = document.getElementById('uploadProgressContainer');
            const progressBar = document.getElementById('uploadCubeFill');
            const progressText = document.getElementById('uploadPercentText');
            
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.innerText = '0%';

            // Run visual loop 1-100%
            await new Promise(resolve => {
                let percent = 0;
                const interval = setInterval(() => {
                    percent++;
                    progressBar.style.width = percent + '%';
                    progressText.innerText = percent + '%';
                    if (percent >= 100) {
                        clearInterval(interval);
                        resolve();
                    }
                }, 15); // Speed
            });

            // Proceed to save after 100%
            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                if (file.type.includes('image')) newItem.type = 'image';
                else if (file.type.includes('pdf')) newItem.type = 'pdf';
                else if (file.type.includes('video')) newItem.type = 'video';
                else newItem.type = 'file';

                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const blob = new Blob([e.target.result], { type: file.type });
                        newItem.file = blob;

                        if (newItem.type === 'pdf') { const base64 = await blobToBase64(blob); newItem.thumb = await generatePDFThumbnail(base64); } 
                        else if (newItem.type === 'image') { newItem.thumb = await createImageThumbnail(blob); }

                        await dbAdd(newItem);
                        appData = await dbGetAll();
                        renderContent(appData[currentCategory][currentSubCategory], currentSubCategory);
                        showToast("Saved!");
                        clearForm();
                    } catch (err) { console.error(err); showToast("Error processing file", true); }
                    
                    setTimeout(() => { progressContainer.style.display = 'none'; btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Save Item'; }, 500);
                };
                reader.readAsArrayBuffer(file);
            } else {
                try { await dbAdd(newItem); appData = await dbGetAll(); renderContent(appData[currentCategory][currentSubCategory], currentSubCategory); showToast("Saved!"); clearForm(); } catch (err) { showToast("Error", true); }
                setTimeout(() => { progressContainer.style.display = 'none'; btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Save Item'; }, 500);
            }
        }

        function blobToBase64(blob) { return new Promise((resolve) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.readAsDataURL(blob); }); }
        function createImageThumbnail(blob) { return new Promise((resolve) => { const img = new Image(); img.src = URL.createObjectURL(blob); img.onload = () => { const c = document.createElement('canvas'); const ctx = c.getContext('2d'); c.width=300; c.height=200; ctx.drawImage(img,0,0,300,200); resolve(c.toDataURL('image/jpeg',0.7)); }; }); }
        function generatePDFThumbnail(base64) { return new Promise((resolve) => { pdfjsLib.getDocument(base64).promise.then(pdf => pdf.getPage(1).then(page => { const viewport = page.getViewport({scale:1.5}); const c = document.createElement('canvas'); const ctx = c.getContext('2d'); c.width=viewport.width; c.height=viewport.height; page.render({canvasContext:ctx, viewport}).promise.then(() => resolve(c.toDataURL())); })); }).catch(() => resolve(null)); }

        function clearForm() { document.getElementById('itemTitle').value = ''; document.getElementById('itemDesc').value = ''; document.getElementById('itemImage').value = ''; document.getElementById('fileName').innerText = ''; document.getElementById('imagePreviewContainer').classList.add('hidden'); }

        async function deleteItem(id) { if (isAdmin) { if (confirm("Delete permanently?")) await performDelete(id); } else { pendingDeleteId = id; document.getElementById('authModal').classList.remove('hidden'); } }
        async function performDelete(id) { appData[currentCategory][currentSubCategory] = appData[currentCategory][currentSubCategory].filter(i => i.id !== id); renderContent(appData[currentCategory][currentSubCategory], currentSubCategory); showToast("Deleted"); try { await dbDelete(id); } catch (e) { console.error(e); } }

        // FILE VIEWER (Zero Clutter)
        function openViewer(id) {
            const item = appData[currentCategory][currentSubCategory].find(i => i.id === id);
            if (!item) return showToast("Item not found", true);
            if (!item.file && !item.thumb) return showToast("No file preview", true);
            
            const modal = document.getElementById('viewerModal');
            const content = document.getElementById('viewerContent');
            viewerState = { zoom: 1, rotation: 0 };
            document.querySelector('.viewer-controls').style.display = 'flex';

            const blobUrl = URL.createObjectURL(item.file);

            // 5. Content Only Logic
            if (item.type === 'image') { content.innerHTML = `<img id="viewerImage" src="${blobUrl}" class="transition-transform duration-200">`; }
            else if (item.type === 'pdf') { content.innerHTML = `<div id="viewerPdfWrapper" style="transform-origin: center; transition: transform 0.2s;" class="w-full h-full flex items-center justify-center"><iframe src="${blobUrl}" class="w-full h-full border-0"></iframe></div>`; }
            else if (item.type === 'video') {
                content.innerHTML = `<video id="viewerVideo" controls autoplay playsinline class="max-h-[90vh] max-w-[90vw] object-contain"><source src="${blobUrl}"></video>`;
                document.querySelector('.viewer-controls').style.display = 'none';
                return;
            }
            else { content.innerHTML = `<div class="text-white text-center"><i class="fas fa-file text-5xl mb-4"></i><p>Preview not available</p></div>`; return; }
            
            modal.classList.add('active');
        }
        
        function closeViewer() { document.getElementById('viewerModal').classList.remove('active'); }
        function viewerAction(action) { const img = document.getElementById('viewerImage'); const pdfWrap = document.getElementById('viewerPdfWrapper'); const target = img || pdfWrap; if (!target) return; if (action === 'zoomIn') viewerState.zoom += 0.2; if (action === 'zoomOut') viewerState.zoom = Math.max(0.2, viewerState.zoom - 0.2); if (action === 'rotateL') viewerState.rotation -= 90; target.style.transform = `scale(${viewerState.zoom}) rotate(${viewerState.rotation}deg)`; }

        // Helpers
        function showToast(msg, err = false) { const t = document.getElementById('toast'); t.innerText = msg; t.className = err ? 'show error' : 'show'; setTimeout(() => t.classList.remove('show'), 2000); }
        
        // 1. File Selection Logic (Real-Time Feedback)
        document.getElementById('itemImage').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                const file = e.target.files[0];
                document.getElementById('fileName').innerText = file.name;
                const previewContainer = document.getElementById('imagePreviewContainer');
                const previewWrapper = document.getElementById('previewWrapper');
                previewContainer.classList.remove('hidden');

                // Clear previous
                previewWrapper.innerHTML = '';

                if (file.type.includes('image')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => { const img = document.createElement('img'); img.src = ev.target.result; img.className = 'w-full h-full object-cover'; previewWrapper.appendChild(img); };
                    reader.readAsDataURL(file);
                } else if (file.type.includes('video')) {
                    const url = URL.createObjectURL(file);
                    const vid = document.createElement('video');
                    vid.src = url + "#t=0.5"; // Seeking metadata
                    vid.className = 'w-full h-full object-cover';
                    vid.muted = true;
                    vid.load();
                    previewWrapper.appendChild(vid);
                } else {
                    previewWrapper.innerHTML = `<div class="text-slate-400 text-xs font-bold pt-10"><i class="fas fa-file text-2xl mb-2"></i><br>No Preview</div>`;
                }
            }
        });
    </script>
</body>
</html>
